<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">How I build — Claude-native workflow</title>
  <desc id="d">A Claude Code terminal running an audit-and-fix loop, next to the AI tooling used every day.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A18"/>
      <stop offset="1" stop-color="#0B1430"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".3" r=".5">
      <stop offset="0" stop-color="#D97757" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
    <rect width="1200" height="44" fill="#080F25" opacity=".85"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#16244F"/>
    <circle cx="26" cy="22" r="6" fill="#FF3D71"/>
    <circle cx="46" cy="22" r="6" fill="#F5C518"/>
    <circle cx="66" cy="22" r="6" fill="#00E676"/>
    <text x="600" y="27" text-anchor="middle" class="mono" font-size="13" fill="#8F9DAD">claude — ~/VS-Gold-OS</text>
    <line x1="780" y1="44" x2="780" y2="400" stroke="#16244F"/>
  </g>

  <!-- terminal session -->
  <g class="mono" font-size="15">
    <text x="36" y="86" class="ln" style="animation-delay:.3s"><tspan fill="#F5C518">vsdev</tspan><tspan fill="#8F9DAD"> ~/VS-Gold-OS </tspan><tspan fill="#BAFD00">❯</tspan><tspan fill="#E5EDF5"> claude</tspan></text>
    <text x="36" y="120" class="ln" style="animation-delay:1s"><tspan fill="#D97757" font-weight="700">&gt;</tspan><tspan fill="#FFFFFF" font-weight="700"> run the Process Audit Check</tspan></text>
    <text x="36" y="154" class="ln" style="animation-delay:1.8s"><tspan fill="#00E5FF">⏺</tspan><tspan fill="#A3B1BF"> Measure the live box · run every test suite</tspan></text>
    <text x="36" y="188" class="ln" style="animation-delay:2.6s"><tspan fill="#00E5FF">⏺</tspan><tspan fill="#A3B1BF"> Fan out read-only auditors → </tspan><tspan fill="#E5EDF5">engine · api · panel · box</tspan></text>
    <text x="36" y="222" class="ln" style="animation-delay:3.4s"><tspan fill="#00E676">✓</tspan><tspan fill="#A3B1BF"> Verify every finding against real code + real data</tspan></text>
    <text x="36" y="256" class="ln" style="animation-delay:4.2s"><tspan fill="#F5C518">⏸</tspan><tspan fill="#F5C518"> Summary to VSDev — waiting for go</tspan></text>
    <text x="36" y="290" class="ln" style="animation-delay:5s"><tspan fill="#D97757" font-weight="700">&gt;</tspan><tspan fill="#FFFFFF" font-weight="700"> go</tspan></text>
    <text x="36" y="324" class="ln" style="animation-delay:5.8s"><tspan fill="#00E676">✓</tspan><tspan fill="#E5EDF5"> 1 fix → 1 commit → 1 deploy → 1 test → push + tag</tspan></text>
    <g class="ln" style="animation-delay:6.6s">
      <text x="36" y="358"><tspan fill="#D97757" font-weight="700">&gt;</tspan></text>
      <rect x="54" y="344" width="9" height="18" fill="#E5EDF5" class="blink"/>
    </g>
  </g>

  <!-- tooling panel -->
  <text x="816" y="82" class="mono" font-size="12" font-weight="700" fill="#D97757" letter-spacing="2.5">CLAUDE-NATIVE WORKFLOW</text>
  <g class="sans">
    <g class="ln" style="animation-delay:.6s">
      <rect x="816" y="102" width="10" height="10" rx="2" fill="#BAFD00"/>
      <text x="838" y="112" font-size="15" font-weight="700" fill="#E5EDF5">12 custom skills</text>
      <text x="838" y="132" class="mono" font-size="12" fill="#8F9DAD">deploy · audit · strategy · UI · docs</text>
    </g>
    <g class="ln" style="animation-delay:1.2s">
      <rect x="816" y="158" width="10" height="10" rx="2" fill="#00E5FF"/>
      <text x="838" y="168" font-size="15" font-weight="700" fill="#E5EDF5">Read-only audit agents</text>
      <text x="838" y="188" class="mono" font-size="12" fill="#8F9DAD">engine · api · panel · live box · EA</text>
    </g>
    <g class="ln" style="animation-delay:1.8s">
      <rect x="816" y="214" width="10" height="10" rx="2" fill="#F5C518"/>
      <text x="838" y="224" font-size="15" font-weight="700" fill="#E5EDF5">Persistent memory</text>
      <text x="838" y="244" class="mono" font-size="12" fill="#8F9DAD">context carried across every session</text>
    </g>
    <g class="ln" style="animation-delay:2.4s">
      <rect x="816" y="270" width="10" height="10" rx="2" fill="#D97757"/>
      <text x="838" y="280" font-size="15" font-weight="700" fill="#E5EDF5">Multi-agent workflows</text>
      <text x="838" y="300" class="mono" font-size="12" fill="#8F9DAD">fan-out research, review, verify</text>
    </g>
    <g class="ln" style="animation-delay:3s">
      <rect x="816" y="326" width="10" height="10" rx="2" fill="#00E676"/>
      <text x="838" y="336" font-size="15" font-weight="700" fill="#E5EDF5">Video → strategy study</text>
      <text x="838" y="356" class="mono" font-size="12" fill="#8F9DAD">local Whisper + chart frames → verdict</text>
    </g>
  </g>
</svg>
