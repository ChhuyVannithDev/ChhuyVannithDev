<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">VS Gold OS — system map</title>
  <desc id="d">Market data flows into a Python trading engine, through a Node API layer backed by PostgreSQL, out to MT5 Expert Advisors, a Laravel admin, a React web app and Telegram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A18"/>
      <stop offset="1" stop-color="#0B1430"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset=".45" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#F0A500"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#16244F"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="470" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .wire{fill:none;stroke:#16244F;stroke-width:2}
    .flow{fill:none;stroke-width:2;stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
    .box{fill:#080F25;stroke:#16244F}
    @keyframes flow{to{stroke-dashoffset:-24}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="470" fill="url(#bg)"/>
    <rect width="1200" height="470" fill="url(#dots)"/>
  </g>

  <text x="40" y="44" class="mono" font-size="12" font-weight="700" fill="#BAFD00" letter-spacing="2.5">VS GOLD OS · SYSTEM MAP</text>
  <text x="40" y="70" class="sans" font-size="17" fill="#A3B1BF">From raw ticks to executed trades — one pipeline, end to end.</text>

  <!-- wires -->
  <path class="wire" d="M210 230 H270"/>
  <path class="wire" d="M490 230 H550"/>
  <path class="wire" d="M380 310 V352"/>
  <path class="wire" d="M650 310 V352"/>
  <path class="wire" d="M750 230 C790 230 790 112 830 112"/>
  <path class="wire" d="M750 230 C790 230 790 190 830 190"/>
  <path class="wire" d="M750 230 C790 230 790 268 830 268"/>
  <path class="wire" d="M750 230 C790 230 790 346 830 346"/>
  <path class="flow" stroke="#F5C518" d="M210 230 H270"/>
  <path class="flow" stroke="#F5C518" d="M490 230 H550"/>
  <path class="flow" stroke="#00E5FF" d="M380 310 V352"/>
  <path class="flow" stroke="#00E5FF" d="M650 310 V352"/>
  <path class="flow" stroke="#F5C518" d="M750 230 C790 230 790 112 830 112"/>
  <path class="flow" stroke="#BAFD00" d="M750 230 C790 230 790 190 830 190"/>
  <path class="flow" stroke="#00E5FF" d="M750 230 C790 230 790 268 830 268"/>
  <path class="flow" stroke="#4FA3E0" d="M750 230 C790 230 790 346 830 346"/>

  <!-- packets -->
  <circle r="4" fill="#FFD75E" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="3s" repeatCount="indefinite" path="M210 230 H270 M490 230 H550"/></circle>
  <circle r="4" fill="#F5C518" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="2.4s" repeatCount="indefinite" path="M750 230 C790 230 790 112 830 112"/></circle>
  <circle r="4" fill="#BAFD00" opacity="0"><set attributeName="opacity" to="1" begin=".6s"/><animateMotion dur="2.4s" begin=".6s" repeatCount="indefinite" path="M750 230 C790 230 790 190 830 190"/></circle>
  <circle r="4" fill="#00E5FF" opacity="0"><set attributeName="opacity" to="1" begin="1.2s"/><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M750 230 C790 230 790 268 830 268"/></circle>
  <circle r="4" fill="#4FA3E0" opacity="0"><set attributeName="opacity" to="1" begin="1.8s"/><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M750 230 C790 230 790 346 830 346"/></circle>

  <!-- market data -->
  <rect class="box" x="40" y="190" width="170" height="80" rx="12"/>
  <text x="60" y="222" class="mono" font-size="11" font-weight="700" fill="#F5C518" letter-spacing="1.5">MARKET DATA</text>
  <text x="60" y="246" class="sans" font-size="14" fill="#E5EDF5">XAUUSD ticks</text>
  <text x="60" y="262" class="mono" font-size="11" fill="#8F9DAD">candle store</text>

  <!-- engine -->
  <rect class="box" x="270" y="150" width="220" height="160" rx="14" stroke="#F5C518" stroke-opacity=".55"/>
  <text x="292" y="184" class="sans" font-size="19" font-weight="800" fill="url(#gold)">Trading Engine</text>
  <text x="292" y="206" class="mono" font-size="12" fill="#8F9DAD">Python</text>
  <g class="sans" font-size="14" fill="#C9D6E3">
    <text x="292" y="240">▸ strategy lanes · risk</text>
    <text x="292" y="264">▸ backtest harness</text>
    <text x="292" y="288">▸ train / validate split</text>
  </g>

  <!-- api -->
  <rect class="box" x="550" y="150" width="200" height="160" rx="14" stroke="#00E5FF" stroke-opacity=".45"/>
  <text x="572" y="184" class="sans" font-size="19" font-weight="800" fill="#E5EDF5">API Layer</text>
  <text x="572" y="206" class="mono" font-size="12" fill="#8F9DAD">Node · Express 5</text>
  <g class="sans" font-size="14" fill="#C9D6E3">
    <text x="572" y="240">▸ gateway</text>
    <text x="572" y="264">▸ web backend</text>
    <text x="572" y="288">▸ trading api</text>
  </g>

  <!-- database -->
  <rect class="box" x="270" y="352" width="480" height="60" rx="12"/>
  <text x="292" y="378" class="sans" font-size="16" font-weight="800" fill="#E5EDF5">PostgreSQL</text>
  <text x="292" y="398" class="mono" font-size="11" fill="#8F9DAD">Supabase · Docker · trade journal + telemetry</text>
  <circle cx="726" cy="382" r="5" fill="#00E676"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>

  <!-- outputs -->
  <rect class="box" x="830" y="80" width="330" height="64" rx="12"/>
  <rect x="830" y="80" width="5" height="64" rx="2" fill="#F5C518"/>
  <text x="852" y="106" class="sans" font-size="16" font-weight="800" fill="#E5EDF5">MT5 Expert Advisors</text>
  <text x="852" y="128" class="mono" font-size="12" fill="#8F9DAD">MQL5 · execution · on-chart dashboards</text>

  <rect class="box" x="830" y="158" width="330" height="64" rx="12"/>
  <rect x="830" y="158" width="5" height="64" rx="2" fill="#BAFD00"/>
  <text x="852" y="184" class="sans" font-size="16" font-weight="800" fill="#E5EDF5">Laravel WebAdmin</text>
  <text x="852" y="206" class="mono" font-size="12" fill="#8F9DAD">ops panel · RBAC · strategy review</text>

  <rect class="box" x="830" y="236" width="330" height="64" rx="12"/>
  <rect x="830" y="236" width="5" height="64" rx="2" fill="#00E5FF"/>
  <text x="852" y="262" class="sans" font-size="16" font-weight="800" fill="#E5EDF5">React WebUI</text>
  <text x="852" y="284" class="mono" font-size="12" fill="#8F9DAD">React 19 · Vite · Tailwind · three.js</text>

  <rect class="box" x="830" y="314" width="330" height="64" rx="12"/>
  <rect x="830" y="314" width="5" height="64" rx="2" fill="#4FA3E0"/>
  <text x="852" y="340" class="sans" font-size="16" font-weight="800" fill="#E5EDF5">Telegram</text>
  <text x="852" y="362" class="mono" font-size="12" fill="#8F9DAD">alerts · payments · bots</text>

  <text x="600" y="448" text-anchor="middle" class="mono" font-size="12" fill="#8F9DAD" letter-spacing="1">PM2 · nginx · php-fpm · Docker · every proven release pushed + tagged</text>
</svg>
