  <title id="t">Engineering stack</title>
  <desc id="d">Trading: MQL5, MetaTrader 5, Python. Backend: PHP, Laravel, Node.js. Frontend: React, Vite, Tailwind, three.js. Data and infra: PostgreSQL, Supabase, Docker, nginx, PM2. AI: Claude Code, subagents, skills, MCP, Whisper, Telegram bots.</desc>
