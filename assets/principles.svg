<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
  <title id="t">Working principles</title>
  <desc id="d">Risk-first engineering, privacy for core IP, real-world usefulness, clear communication, built to scale.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1430"/>
      <stop offset="1" stop-color="#050A18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset=".45" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#F0A500"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .n{font-size:30px;font-weight:800}
    .t1{font-size:18px;font-weight:800;fill:#E5EDF5}
    .t2{font-size:18px;font-weight:800}
    .p{font-size:13px;fill:#A3B1BF}
  </style>

  <g transform="translate(40 10)">
    <rect width="211" height="210" rx="16" fill="url(#card)" stroke="#16244F"/>
    <text x="20" y="46" class="mono n" fill="url(#gold)">01</text>
    <text x="20" y="84" class="sans t1">Risk-first</text>
    <text x="20" y="106" class="sans t2" fill="#F5C518">engineering</text>
    <text x="20" y="140" class="sans p">Control, monitoring and</text>
    <text x="20" y="160" class="sans p">long-term reliability,</text>
    <text x="20" y="180" class="sans p">not just returns.</text>
  </g>
  <g transform="translate(267 10)">
    <rect width="211" height="210" rx="16" fill="url(#card)" stroke="#16244F"/>
    <text x="20" y="46" class="mono n" fill="url(#gold)">02</text>
    <text x="20" y="84" class="sans t1">Privacy for</text>
    <text x="20" y="106" class="sans t2" fill="#BAFD00">core IP</text>
    <text x="20" y="140" class="sans p">Public pages show outcomes</text>
    <text x="20" y="160" class="sans p">and features; proprietary</text>
    <text x="20" y="180" class="sans p">logic stays protected.</text>
  </g>
  <g transform="translate(494 10)">
    <rect width="211" height="210" rx="16" fill="url(#card)" stroke="#16244F"/>
    <text x="20" y="46" class="mono n" fill="url(#gold)">03</text>
    <text x="20" y="84" class="sans t1">Real-world</text>
    <text x="20" y="106" class="sans t2" fill="#00E5FF">usefulness</text>
    <text x="20" y="140" class="sans p">Every system has to solve</text>
    <text x="20" y="160" class="sans p">a real client or</text>
    <text x="20" y="180" class="sans p">operational problem.</text>
  </g>
  <g transform="translate(721 10)">
    <rect width="211" height="210" rx="16" fill="url(#card)" stroke="#16244F"/>
    <text x="20" y="46" class="mono n" fill="url(#gold)">04</text>
    <text x="20" y="84" class="sans t1">Clear</text>
    <text x="20" y="106" class="sans t2" fill="#4FA3E0">communication</text>
    <text x="20" y="140" class="sans p">Docs, dashboards and</text>
    <text x="20" y="160" class="sans p">reports that clients and</text>
    <text x="20" y="180" class="sans p">operators understand.</text>
  </g>
  <g transform="translate(948 10)">
    <rect width="212" height="210" rx="16" fill="url(#card)" stroke="#16244F"/>
    <text x="20" y="46" class="mono n" fill="url(#gold)">05</text>
    <text x="20" y="84" class="sans t1">Built</text>
    <text x="20" y="106" class="sans t2" fill="#C792EA">to scale</text>
    <text x="20" y="140" class="sans p">Ready for future users,</text>
    <text x="20" y="160" class="sans p">teams, partners and</text>
    <text x="20" y="180" class="sans p">service expansion.</text>
  </g>
</svg>
