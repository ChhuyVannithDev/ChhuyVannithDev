<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Three trade types — Swing, Medium, Scalper / Grid</title>
  <desc id="d">Every gold-trading idea is researched and scored for three styles: swing, intraday medium, and scalper or grid.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1430"/>
      <stop offset="1" stop-color="#050A18"/>
    </linearGradient>
    <linearGradient id="fGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C518" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F5C518" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fLime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BAFD00" stop-opacity=".22"/>
      <stop offset="1" stop-color="#BAFD00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .line{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
  </style>

  <!-- SWING -->
  <g class="card" style="animation-delay:.1s">
    <rect x="40" y="20" width="357" height="260" rx="18" fill="url(#card)" stroke="#16244F"/>
    <rect x="40" y="20" width="357" height="4" rx="2" fill="#F5C518"/>
    <text x="64" y="58" class="mono" font-size="12" font-weight="700" fill="#F5C518" letter-spacing="2">01 · SWING</text>
    <text x="64" y="90" class="sans" font-size="24" font-weight="800" fill="#E5EDF5">Patient &amp; positional</text>
    <text x="64" y="112" class="mono" font-size="12" fill="#8F9DAD">1 trade a day · multi-day hold</text>
    <g transform="translate(64 128)">
      <path class="area" d="M0 72 C60 72 80 24 140 32 S220 76 260 42 S300 8 309 4 V86 H0 Z" fill="url(#fGold)"/>
      <path class="line" d="M0 72 C60 72 80 24 140 32 S220 76 260 42 S300 8 309 4" stroke="#F5C518"/>
      <circle r="5" fill="#FFE9A8" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="6s" repeatCount="indefinite" path="M0 72 C60 72 80 24 140 32 S220 76 260 42 S300 8 309 4"/></circle>
    </g>
    <text x="64" y="240" class="sans" font-size="14" fill="#A3B1BF">Discount / premium entries,</text>
    <text x="64" y="260" class="sans" font-size="14" fill="#A3B1BF">bigger targets, fewer decisions.</text>
  </g>

  <!-- MEDIUM -->
  <g class="card" style="animation-delay:.3s">
    <rect x="421" y="20" width="357" height="260" rx="18" fill="url(#card)" stroke="#16244F"/>
    <rect x="421" y="20" width="357" height="4" rx="2" fill="#BAFD00"/>
    <text x="445" y="58" class="mono" font-size="12" font-weight="700" fill="#BAFD00" letter-spacing="2">02 · MEDIUM</text>
    <text x="445" y="90" class="sans" font-size="24" font-weight="800" fill="#E5EDF5">Intraday precision</text>
    <text x="445" y="112" class="mono" font-size="12" fill="#8F9DAD">session-based · fixed $ risk</text>
    <g transform="translate(445 128)">
      <path class="area" d="M0 76 L30 60 L50 68 L80 46 L100 54 L130 34 L150 42 L180 24 L200 32 L230 16 L260 22 L309 4 V86 H0 Z" fill="url(#fLime)"/>
      <path class="line" d="M0 76 L30 60 L50 68 L80 46 L100 54 L130 34 L150 42 L180 24 L200 32 L230 16 L260 22 L309 4" stroke="#BAFD00"/>
      <circle r="5" fill="#E4FF8A" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="3.5s" repeatCount="indefinite" path="M0 76 L30 60 L50 68 L80 46 L100 54 L130 34 L150 42 L180 24 L200 32 L230 16 L260 22 L309 4"/></circle>
      <line x1="0" y1="80" x2="309" y2="80" stroke="#FF3D71" stroke-dasharray="4 4" opacity=".7"/>
      <text x="309" y="98" text-anchor="end" class="mono" font-size="10" fill="#FF3D71">SL</text>
    </g>
    <text x="445" y="240" class="sans" font-size="14" fill="#A3B1BF">Defined stop, 1R+ targets,</text>
    <text x="445" y="260" class="sans" font-size="14" fill="#A3B1BF">in and out the same day.</text>
  </g>

  <!-- SCALPER / GRID -->
  <g class="card" style="animation-delay:.5s">
    <rect x="802" y="20" width="358" height="260" rx="18" fill="url(#card)" stroke="#16244F"/>
    <rect x="802" y="20" width="358" height="4" rx="2" fill="#00E5FF"/>
    <text x="826" y="58" class="mono" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="2">03 · SCALPER / GRID</text>
    <text x="826" y="90" class="sans" font-size="24" font-weight="800" fill="#E5EDF5">High-frequency engine</text>
    <text x="826" y="112" class="mono" font-size="12" fill="#8F9DAD">EA Ultra · grid-aware execution</text>
    <g transform="translate(826 128)">
      <g stroke="#16244F" stroke-dasharray="3 4">
        <line x1="0" y1="12" x2="309" y2="12"/>
        <line x1="0" y1="32" x2="309" y2="32"/>
        <line x1="0" y1="52" x2="309" y2="52"/>
        <line x1="0" y1="72" x2="309" y2="72"/>
      </g>
      <path class="line" d="M0 52 L20 32 L35 52 L55 32 L70 52 L90 12 L105 32 L125 12 L140 32 L160 12 L175 52 L195 32 L215 52 L235 32 L250 12 L270 32 L290 12 L309 32" stroke="#00E5FF"/>
      <circle r="5" fill="#A6F6FF" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="2s" repeatCount="indefinite" path="M0 52 L20 32 L35 52 L55 32 L70 52 L90 12 L105 32 L125 12 L140 32 L160 12 L175 52 L195 32 L215 52 L235 32 L250 12 L270 32 L290 12 L309 32"/></circle>
    </g>
    <text x="826" y="240" class="sans" font-size="14" fill="#A3B1BF">Fast layered entries with</text>
    <text x="826" y="260" class="sans" font-size="14" fill="#A3B1BF">risk-capped grid management.</text>
  </g>
</svg>
